# Fixed project name, so the containers and data volume are the same wherever this is run from.
name: orgniser
# Local development services. Start with: docker compose up -d
# Credentials here are for local use only; production values come from the environment.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: orgniser
      POSTGRES_PASSWORD: orgniser
      POSTGRES_DB: orgniser
    ports:
      # Host 5433, so it doesn't clash with a natively installed PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orgniser -d orgniser"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage is not here yet: MinIO's images were removed from Docker Hub and
  # quay.io (Sept 2026), and the storage choice is still open (docs/MEMORY.md).

volumes:
  postgres-data:
